name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Run Android unit tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testReleaseUnitTest

  release:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Resolve app version
        id: app_version
        run: |
          APP_VER=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          echo "version=$APP_VER" >> $GITHUB_OUTPUT

      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ] || [ -z "$K_ALIAS" ] || [ -z "$K_PW" ]; then
            echo "ERROR: Missing required signing secret(s)!"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KS_PW" "$K_ALIAS" "$K_PW" > android/key.properties

      - name: Build arm64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --android-skip-build-dependency-validation

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --android-skip-build-dependency-validation

      - name: Verify APK, AAB and Signature
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$APK" ]; then
            echo "ERROR: Expected APK not found at $APK"
            exit 1
          fi
          if [ ! -f "$AAB" ]; then
            echo "ERROR: Expected AAB not found at $AAB"
            exit 1
          fi

          echo "### ARM64 Release APK Size" >> $GITHUB_STEP_SUMMARY
          ls -lh "$APK" | awk '{printf "- **File:** %s\n- **Size:** %s (%.2f MB)\n", $9, $5, $5/1048576}' >> $GITHUB_STEP_SUMMARY

          echo "### Release App Bundle (AAB) Size" >> $GITHUB_STEP_SUMMARY
          ls -lh "$AAB" | awk '{printf "- **File:** %s\n- **Size:** %s (%.2f MB)\n", $9, $5, $5/1048576}' >> $GITHUB_STEP_SUMMARY

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")

          if echo "$CERT_OUTPUT" | grep -q "CN=Android Debug"; then
            echo "ERROR: APK is signed with debug key!"
            exit 1
          fi

          if ! echo "$CERT_OUTPUT" | grep -q "CN=Elmahdi ABDALLH"; then
            echo "ERROR: Expected signing subject CN=Elmahdi ABDALLH not found in APK!"
            echo "$CERT_OUTPUT"
            exit 1
          fi

          echo "APK Signature verified: CN=Elmahdi ABDALLH"
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "$CERT_OUTPUT" | grep "Signer #1" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "Verifying AAB signature..."
          if ! jarsigner -verify -verbose -certs "$AAB" | grep -q "CN=Elmahdi ABDALLH"; then
            echo "ERROR: Expected signing subject CN=Elmahdi ABDALLH not found in AAB!"
            exit 1
          fi
          echo "AAB Signature verified: CN=Elmahdi ABDALLH"

      - name: Cleanup signing credentials
        if: always()
        run: |
          rm -f android/app/release.jks android/key.properties

      - name: Upload arm64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: mega-v${{ steps.app_version.outputs.version }}-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      - name: Upload release App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: mega-v${{ steps.app_version.outputs.version }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
