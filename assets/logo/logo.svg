<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="#12352B"/>
  
  <!-- Outer Connection Wave -->
  <path d="M 176 170 A 110 110 0 0 1 336 170" fill="none" stroke="#087A50" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Inner Connection Wave -->
  <path d="M 210 200 A 64 64 0 0 1 302 200" fill="none" stroke="#F5C542" stroke-width="12" stroke-linecap="round"/>

  <!-- Connectivity Dot -->
  <circle cx="256" cy="224" r="10" fill="#087A50"/>
  
  <!-- Geometric "M" Icon / Waves Core -->
  <path d="M 160 300 L 160 210 L 220 270 L 256 235 L 292 270 L 352 210 L 352 300" 
        fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Wordmark "MEGA" -->
  <text x="256" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">MEGA</text>
  
  <!-- Arabic Wordmark "ميقا" -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#F5C542" text-anchor="middle">ميقا</text>
</svg>
